<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Status</title>
<style>
  :root {
    --bg: #0b0d10;
    --card: #14171c;
    --border: #262b33;
    --text: #e8eaed;
    --muted: #8a919c;
    --ok: #3ddc84;
    --bad: #ff5c5c;
    --accent: #5b9dff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Segoe UI, Roboto, sans-serif;
    padding: 20px 16px 60px;
    max-width: 560px;
    margin: 0 auto;
  }
  h1 {
    font-size: 20px;
    margin: 4px 0 2px;
  }
  .updated {
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 20px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 14px;
  }
  .card h2 {
    font-size: 15px;
    margin: 0 0 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .dot.on { background: var(--ok); box-shadow: 0 0 6px var(--ok); }
  .dot.off { background: var(--bad); box-shadow: 0 0 6px var(--bad); }
  .row {
    font-size: 13px;
    color: var(--muted);
    margin: 4px 0;
    line-height: 1.5;
    word-break: break-word;
  }
  .row strong { color: var(--text); font-weight: 500; }
  .mono {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    background: #1c2028;
    border-radius: 8px;
    padding: 8px 10px;
    margin-top: 6px;
    color: #c2c8d1;
    white-space: pre-wrap;
  }
  .reminder {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    padding: 6px 0;
    border-bottom: 1px solid var(--border);
  }
  .reminder:last-child { border-bottom: none; }
  .reminder .cadence { color: var(--accent); }
  .error { color: var(--bad); }
  .empty { color: var(--muted); font-style: italic; }
  .day-group { margin-bottom: 14px; }
  .day-group:last-child { margin-bottom: 0; }
  .day-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .day-label.today { color: var(--text); }
  .slot {
    border-radius: 10px;
    padding: 8px 10px;
    margin-bottom: 6px;
    border: 1px solid transparent;
  }
  .slot:last-child { margin-bottom: 0; }
  .slot-top {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 13px;
    font-weight: 600;
  }
  .slot-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .slot-time {
    margin-left: auto;
    font-size: 12px;
    font-weight: 500;
    color: var(--muted);
  }
  .slot-meta {
    font-size: 12px;
    color: var(--muted);
    padding-left: 15px;
    margin-top: 2px;
  }
</style>
</head>
<body>
  <h1>Pipeline Status</h1>
  <div class="updated" id="updated">Loading…</div>

  <div class="card">
    <h2><span class="dot" id="trading-dot"></span>AI Trading — Forex Paper Loop</h2>
    <div class="row" id="trading-body">Loading…</div>
  </div>

  <div class="card">
    <h2><span class="dot" id="etsy-dot"></span>Etsy Auto-Generation</h2>
    <div class="row" id="etsy-body">Loading…</div>
  </div>

  <div class="card">
    <h2>Upload Reminders</h2>
    <div id="reminders">Loading…</div>
  </div>

  <div class="card">
    <h2>Weekly Timetable</h2>
    <div class="row" style="margin-bottom:10px">All times Europe/Dublin</div>
    <div id="timetable">Loading…</div>
  </div>

  <script>
    const REPO_RAW = "https://raw.githubusercontent.com/danielb611/mobile-status/main/status.json";

    function fmtAgo(iso) {
      if (!iso) return "unknown";
      const d = new Date(iso);
      const mins = Math.round((Date.now() - d.getTime()) / 60000);
      if (mins < 1) return "just now";
      if (mins < 60) return mins + "m ago";
      const hrs = Math.round(mins / 60);
      if (hrs < 48) return hrs + "h ago";
      return Math.round(hrs / 24) + "d ago";
    }

    function fmtWhen(iso) {
      if (!iso) return "unknown";
      const d = new Date(iso);
      return d.toLocaleString("en-IE", { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
    }

    async function load() {
      let data;
      try {
        const res = await fetch(REPO_RAW + "?t=" + Date.now());
        data = await res.json();
      } catch (e) {
        document.getElementById("updated").textContent = "Failed to load status — check connection.";
        return;
      }

      document.getElementById("updated").textContent =
        "Last synced " + fmtAgo(data.generated_at) + " (" + fmtWhen(data.generated_at) + ")";

      // Trading
      const t = data.trading;
      document.getElementById("trading-dot").className = "dot " + (t.launchd_running ? "on" : "off");
      let tBody = `<div><strong>${t.launchd_running ? "Running" : "Not running"}</strong>${t.pid ? " (pid " + t.pid + ")" : ""}</div>`;
      if (t.last_scan) {
        tBody += `<div style="margin-top:6px">Last scan: <strong>${fmtAgo(t.log_mtime)}</strong></div>`;
        tBody += `<div class="mono">${t.last_scan.detail}</div>`;
      } else {
        tBody += `<div class="empty">No scan data yet</div>`;
      }
      if (t.last_error_line) {
        tBody += `<div class="row error" style="margin-top:6px">Recent error logged — check log directly</div>`;
      }
      document.getElementById("trading-body").innerHTML = tBody;

      // Etsy
      const e = data.etsy;
      document.getElementById("etsy-dot").className = "dot " + (e.launchd_running ? "on" : "off");
      let eBody = `<div><strong>${e.launchd_running ? "Scheduled & active" : "Not loaded"}</strong></div>`;
      eBody += `<div style="margin-top:6px">Last completed run: <strong>${fmtAgo(e.log_mtime)}</strong></div>`;
      eBody += `<div style="margin-top:4px">Next scheduled: <strong>${fmtWhen(e.next_scheduled)}</strong></div>`;
      if (e.recent_errors && e.recent_errors.length) {
        eBody += `<div class="mono error">${e.recent_errors.join("\n")}</div>`;
      }
      document.getElementById("etsy-body").innerHTML = eBody;

      // Reminders
      const remHtml = data.reminders.map(r =>
        `<div class="reminder"><span>${r.method}</span><span class="cadence">${r.cadence}</span></div>`
      ).join("");
      document.getElementById("reminders").innerHTML = remHtml || `<div class="empty">None</div>`;

      // Weekly timetable
      const DAY_ORDER = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
      const todayName = new Intl.DateTimeFormat("en-IE", { weekday: "long", timeZone: "Europe/Dublin" }).format(new Date());
      function tint(hex, alpha) {
        const n = parseInt(hex.slice(1), 16);
        return `rgba(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}, ${alpha})`;
      }
      const tt = data.timetable || {};
      const ttHtml = DAY_ORDER.map(day => {
        const slots = tt[day] || [];
        if (!slots.length) return "";
        const isToday = day === todayName;
        const slotsHtml = slots.map(s => `
          <div class="slot" style="background:${tint(s.colour, 0.12)};border-color:${tint(s.colour, 0.35)}">
            <div class="slot-top">
              <span class="slot-dot" style="background:${s.colour}"></span>
              <span style="color:${s.colour}">${s.account}</span>
              <span class="slot-time">${s.time}</span>
            </div>
            <div class="slot-meta">${s.platform}${s.detail ? " — " + s.detail : ""}</div>
          </div>
        `).join("");
        return `
          <div class="day-group">
            <div class="day-label${isToday ? " today" : ""}">${day}${isToday ? " · today" : ""}</div>
            ${slotsHtml}
          </div>
        `;
      }).join("");
      document.getElementById("timetable").innerHTML = ttHtml || `<div class="empty">No schedule data</div>`;
    }

    load();
  </script>
</body>
</html>
